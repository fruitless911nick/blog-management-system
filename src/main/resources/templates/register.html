<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>TrueBook | Register</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body
style="
background-image: url('/background-image/wall3.jpg');
background-repeat: no-repeat;
background-size: cover;
background-position: center;
background-attachment: fixed;
">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow p-4" style="width: 24rem; border-radius: 12px;background-color:#ffeddf">

        <div class="text-center mb-4">

       <!--     <i class="bi bi-journal-bookmark-fill text-warning"
               style="font-size:3rem;"></i> -->

            <h3 class="mt-2 mb-1">
                Create Account
            </h3>

            <p class="text-muted mb-0">
                Join TrueBook today.
            </p>

        </div>

        <form th:action="@{/register}" method="post">

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Enter your username"
                        required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email Address
                </label>

                <input
                        type="email"
                        class="form-control"
                        name="email"
                        placeholder="name@example.com"
                        required>

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Enter password"
                        minlength="6"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn btn-warning w-100">

                <i class="bi bi-person-plus-fill"></i>

                Register

            </button>

        </form>

        <hr>

        <p class="text-center mb-0">

            Already have an account?

            <a th:href="@{/login}"
               class="text-decoration-none">

                Login

            </a>

        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
