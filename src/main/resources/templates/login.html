<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <title>TrueBook | Login</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body
style="
background-image: url('/background-image/wall3.jpg');
background-repeat: no-repeat;
background-size: cover;
background-position: center;
background-attachment: fixed;
">

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow p-4" style="width:24rem; border-radius:12px;background-color: #ffeddf">

        <div class="text-center mb-4">

            <h3 class="mb-1">
                Login
            </h3>

            <p class="text-muted">
                Welcome back! Sign in to continue.
            </p>

        </div>

        <!-- Error Message -->
        <div class="alert alert-danger" th:if="${param.error}">
            Invalid email or password.
        </div>

        <!-- Logout Message -->
        <div class="alert alert-success" th:if="${param.logout}">
            Logged out successfully.
        </div>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">

                <label for="email" class="form-label">
                    Email Address
                </label>

                <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="username"
                        placeholder="Enter your email"
                        required>

            </div>

            <div class="mb-4">

                <label for="password" class="form-label">
                    Password
                </label>

                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

            </div>

            <button
                    type="submit"
                    class="btn btn-warning w-100">

                Login

            </button>

        </form>

        <hr>

        <p class="text-center mb-0">

            New User?

            <a th:href="@{/register}" class="text-decoration-none">

                Register

            </a>

        </p>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
